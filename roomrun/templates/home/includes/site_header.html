{% load i18n static %}

<header class="sticky top-0 z-50 border-b border-line bg-paper/92 backdrop-blur">
  <nav class="rr-container flex h-18 items-center gap-8"
       aria-label="{% translate 'Main navigation' %}">
    <a href="{% url 'home' %}"
       class="mr-auto flex items-center gap-2 font-display text-lg font-semibold text-primary"
       aria-label="ROOMRUN">
      <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-primary shadow-md shadow-primary/20">
        <img src="{% static 'images/logo/logo.png' %}"
             alt="ROOMRUN"
             class="size-6 object-contain" />
      </span>
      ROOMRUN
    </a>
    <div class="hidden items-center gap-7 md:flex">
      <a class="rr-nav-link" href="{% url 'home' %}#ecosysteme">{% translate "Ecosystem" %}</a>
      <a class="rr-nav-link" href="{% url 'home' %}#fonctionnalites">{% translate "Features" %}</a>
      <a class="rr-nav-link" href="{% url 'home' %}#tarifs">{% translate "Pricing" %}</a>
      <a class="rr-nav-link" href="{% url 'about' %}">{% translate "About" %}</a>
    </div>
    <div class="hidden items-center gap-4 sm:flex">
      {% if user.is_authenticated %}
        <a class="rr-btn-dark px-4 py-2.5"
           href="{% url 'dashboard:dashboard' %}">{% translate "Dashboard" %}</a>
      {% else %}
        <a class="rr-nav-link" href="{% url 'users:signin' %}">{% translate "Sign in" %}</a>
        <a class="rr-btn-dark px-4 py-2.5" href="{% url 'users:signup' %}">{% translate "Create an account" %}</a>
      {% endif %}
    </div>
  </nav>
</header>
