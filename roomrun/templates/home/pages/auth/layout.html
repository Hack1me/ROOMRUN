{% load static %}
<!doctype html>
<html lang="{{ LANGUAGE_CODE }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}ROOMRUN{% endblock title %}</title>
    <link rel="stylesheet" href="{% static 'vendor/tabler/tabler-icons.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
    <link rel="icon" href="{% static 'images/favicons/favicon.ico' %}">
    {% block extra_css %}{% endblock extra_css %}
  </head>
  <body class="bg-surface font-sans text-ink antialiased">
    <main class="flex min-h-screen">
      {% include "home/includes/brand_panel.html" %}
      {% block content %}{% endblock content %}
    </main>
    <script src="{% url 'jsi18n' %}"></script>
    {% block extra_js %}{% endblock extra_js %}
  </body>
</html>
