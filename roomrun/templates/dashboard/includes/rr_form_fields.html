{% for field in form %}
  <div class="rr-field">
    <label for="{{ field.id_for_label }}">
      {{ field.label }}{% if field.field.required %} *{% endif %}
    </label>
    {{ field }}
    {% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}
    {% for error in field.errors %}<small class="rr-error">{{ error }}</small>{% endfor %}
  </div>
{% endfor %}
