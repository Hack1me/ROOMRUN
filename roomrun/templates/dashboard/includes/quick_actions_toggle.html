{% load i18n %}
<button type="button"
        class="quick-actions-toggle"
        data-quick-actions-toggle
        aria-controls="{{ panel_id }}"
        aria-expanded="true"
        aria-label="{% translate 'Show quick actions' %}"
        data-label-open="{% translate 'Show quick actions' %}"
        data-label-close="{% translate 'Hide quick actions' %}"
        data-modal-title="{% translate 'Quick actions' %}"
        title="{% translate 'Show quick actions' %}">
  <i class="ti ti-plus" aria-hidden="true"></i>
</button>
