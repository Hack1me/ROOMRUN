{% extends "errors/base.html" %}

{% block title %}Page not found{% endblock title %}
{% block content %}
  <h1 class="rr-display text-3xl">Page not found</h1>
  <p class="mt-4 leading-7 text-muted">
    {% if exception %}
      {{ exception }}
    {% else %}
      This is not the page you were looking for.
    {% endif %}
  </p>
{% endblock content %}
