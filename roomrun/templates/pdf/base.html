{% load static %}

<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <title>
        {% block title %}
            RoomRun
        {% endblock %}
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            color: #1e293b;
            font-size: 11px;
            line-height: 1.6;
        }

        h1,
        h2,
        h3 {
            color: #16283f;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        .header {
            margin-bottom: 30px;
        }

        .footer {
            margin-top: 30px;
            color: #64748b;
            font-size: 9px;
            text-align: center;
        }

        .text-center {
            text-align: center;
        }

        .text-right {
            text-align: right;
        }

        .page-break {
            page-break-before: always;
        }

    </style>

    {% block extra_css %}
    {% endblock %}

</head>

<body>

    <header class="header">

        {% block header %}
            <strong>RoomRun</strong>
        {% endblock %}

    </header>


    <main>

        {% block content %}
        {% endblock %}

    </main>


    <footer class="footer">

        {% block footer %}
            RoomRun
        {% endblock %}

    </footer>

</body>

</html>
